[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enviro-data-pipeline"
version = "0.1.0"
description = "Validated input layer for the environmental site data pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
terrain = ["rasterio>=1.3"]
earth-engine = ["earthengine-api>=1.6"]
osm = ["requests>=2.31"]
local-osm = ["pyshp>=3.1", "shapely>=2.1", "rasterio>=1.3"]
test = ["pytest>=8", "rasterio>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
